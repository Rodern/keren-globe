name: Deploy to VPS

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: deploy
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Create deployment directory if it doesn't exist
          mkdir -p /opt/projects/proxy/keren-globe
          
          # We pull the code from Git instead of SCP
          if [ -d "/opt/projects/proxy/keren-globe/.git" ]; then
            cd /opt/projects/proxy/keren-globe
            git pull origin main
          else
            git clone https://github.com/${{ github.repository }}.git /opt/projects/proxy/keren-globe
            cd /opt/projects/proxy/keren-globe
          fi

          # Build and deploy
          docker-compose -f docker-compose.vps.yml down
          docker-compose -f docker-compose.vps.yml up -d --build
